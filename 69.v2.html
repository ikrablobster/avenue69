<body>
  <a class="logo_link" href="https://ikrablobster.github.io/avenue69/bar-calc.html">
    <h1>Avenue69</h1>
  </a>
  <h2>Закрытие чека v2.0</h2>

  <form onsubmit="calculate(); return false;">
    <label>
      <input type="number" id="amount" min="1">
    </label>
    <button type="submit">Рассчитать</button>
  </form>

  <div id="result"></div>

  <script>
    const prices = [

      { price: 465, code: "153" }, { price: 355, code: "154" },
      { price: 155, code: "155" }, { price: 325, code: "156" },
      { price: 365, code: "157" }, { price: 315, code: "158" },
      { price: 365, code: "159" }, { price: 345, code: "160" },
      { price: 295, code: "161" }, { price: 345, code: "162" },
      { price: 195, code: "163" }, { price: 125, code: "164" },
      { price: 125, code: "165" }, { price: 95, code: "166" },
      { price: 175, code: "167" }, { price: 145, code: "168" },
      { price: 215, code: "169" }, { price: 165, code: "170" },
      { price: 215, code: "171" }, { price: 245, code: "172" },
      { price: 255, code: "173" }, { price: 155, code: "174" },
      { price: 195, code: "175" }
    ];

    // Сколько комбинаций ищем за один проход (раньше было заявлено как
    // MAX_RESULTS = 4, но реально не использовалось — реальный предел был
    // захардкожен числом 2 внутри dfs; теперь это один явный параметр).
    const RESULTS_PER_PASS = 2;

    // Код позиции с ценой 1 ₽ и лимит повторов для неё.
    const SPECIAL_ITEM_CODE = "149";
    const SPECIAL_ITEM_MAX_COUNT = 2;

    // Позиции, из которых может браться шаг округления. Раньше число 29 и
    // код "136" были захардкожены прямо в расчёте и в тексте — если бы цена
    // этой позиции в меню изменилась, расчёт и подпись могли бы разойтись.
    // Теперь оба берутся из самих данных. С новым меню код 138 даёт ту же
    // роль с ценой 19 ₽, поэтому на каждый расчёт позиция для округления
    // выбирается случайно: 29 (код 136) или 19 (код 138) с шансом 50/50.
    const ROUNDING_ITEMS = [
      prices.find(p => p.code === "136"),
      prices.find(p => p.code === "138")
    ];

    // prices не меняется во время работы страницы, поэтому сортировку по
    // убыванию цены можно сделать один раз при загрузке, а не при каждом
    // нажатии кнопки.
    const pricesDesc = [...prices].sort((a, b) => b.price - a.price);

    function findAllCombinations(amount, pricesArray, maxResults = RESULTS_PER_PASS) {
      const results = [];
      // Состояния (index:остаток), из которых точно не получить решение —
      // без этого кэша перебор повторно обходит одни и те же тупиковые
      // ветки при каждом вызове dfs.
      const deadEnds = new Set();

      function dfs(index, remaining, current) {
        if (results.length >= maxResults) return true;
        if (remaining === 0) {
          results.push([...current]);
          return true;
        }
        if (index >= pricesArray.length || remaining < 0) return false;

        const key = index + ':' + remaining;
        if (deadEnds.has(key)) return false;

        const { price, code } = pricesArray[index];
        const maxCount = price === 1 ? SPECIAL_ITEM_MAX_COUNT : Math.floor(remaining / price);

        let foundAny = false;
        for (let count = maxCount; count >= 0; count--) {
          if (count > 0) current.push({ price, code, count });
          const found = dfs(index + 1, remaining - price * count, current);
          if (count > 0) current.pop();
          if (found) foundAny = true;
          if (results.length >= maxResults) return true;
        }
        if (!foundAny) deadEnds.add(key);
        return foundAny;
      }

      dfs(0, amount, []);
      return results;
    }


    function calculate() {
      const rawValue = document.getElementById("amount").value;
      const N = Number(rawValue);
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      if (!rawValue || !Number.isInteger(N) || N <= 0) {
        resultDiv.innerHTML = '<p class="error">Введите корректную сумму</p>';
        return;
      }

      // === ШАГ 0: проверка прямого совпадения price ===
      const matches = prices
        .filter(p => p.price === N)
        .sort((a, b) => Number(b.code) - Number(a.code));

      if (matches.length > 0) {
        let html = `
    <p>Шаг 3. Есть прямые совпадения</p>
  `;

        html += `<ul>`;
        matches.forEach(m => {
          html += `<li>${m.price} (code ${m.code})</li>`;
        });
        html += `</ul>`;

        resultDiv.innerHTML = html;
        return;
      }


      // === ШАГ 1 ===
      // Позиция для округления выбирается случайно (50/50) при каждом расчёте.
      const ROUNDING_ITEM = ROUNDING_ITEMS[Math.random() < 0.5 ? 0 : 1];
      const d = ((N % 10) + 10) % 10;
      const k = (10 - d) % 10;
      const R = N - ROUNDING_ITEM.price * k;

      const amountForSplit = R > 0 ? R : N;

      // === КОМБИНАЦИИ 1–2: САМЫЕ БОЛЬШИЕ PRICE ===
      const firstTwo = findAllCombinations(amountForSplit, pricesDesc);

      // === КОМБИНАЦИИ 3–4: КАК СЕЙЧАС ===
      const lastTwo = findAllCombinations(amountForSplit, prices);

      const finalCombos = [...firstTwo, ...lastTwo];

      if (!finalCombos.length) {
        resultDiv.innerHTML = '<p class="error">Комбинации не найдены</p>';
        return;
      }

      let html = `<div class="box">`;

      if (k > 0 && R > 0) {
        html += `
      <div>        
        <p>Шаг 1. ${ROUNDING_ITEM.price} (${ROUNDING_ITEM.code}) * ${k}</p>
        <p>
          ${ROUNDING_ITEM.price} × ${k} = ${ROUNDING_ITEM.price * k}<br>
          Остаток: <strong>${R}</strong>
        </p>
      </div>
    `;
      }

      html += `
    <div>
      <p>Шаг 2. Разбиение остатка <b>${amountForSplit}</b></p>
  `;

      finalCombos.forEach((combo, index) => {
        const has149 = combo.some(i => i.code === SPECIAL_ITEM_CODE);

        html += `
      <div class="combo ${has149 ? 'highlight' : ''}">
        <strong>Комбинация ${index + 1}</strong>
        <ul>
    `;

        combo.forEach(i => {
          html += `<li>${i.price} ( ${i.code} ) × ${i.count}</li>`;
        });

        html += `</ul></div>`;
      });

      html += `</div></div>`;
      resultDiv.innerHTML = html;
    }

  </script>
